# Roadmap SECURITY-03: dependency updates arrive as reviewable PRs instead of
# being noticed by hand. Related packages move together so a framework bump is
# one PR (a half-bumped Nest or Angular set does not build), and the CI audit
# step (`pnpm audit --prod`) is the gate for advisories.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      angular:
        patterns: ['@angular/*', '@angular-eslint/*', 'angular-eslint']
      tooling:
        dependency-type: development
        exclude-patterns: ['@nestjs/*', '@angular/*', '@angular-eslint/*', 'angular-eslint']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
