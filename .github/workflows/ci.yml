name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pmhybrid
          POSTGRES_PASSWORD: pmhybrid
          POSTGRES_DB: pmhybrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmhybrid -d pmhybrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pmhybrid:pmhybrid@localhost:5432/pmhybrid?schema=public
      # Throwaway CI-only value — never a real secret, no production JWTs are
      # ever verified against it.
      JWT_SECRET: ci-only-not-a-real-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SYNC_SCHEDULER_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm (version pinned by package.json's packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build on a known high/critical advisory in what actually ships
      # (Roadmap SECURITY-03: a multer DoS sat unnoticed here for weeks because
      # nothing ran an audit). Dev-only tooling is left out on purpose; the
      # weekly Dependabot PRs cover it.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Both apps import from packages/shared-types' built dist/, not its
      # source — must exist before lint (type-aware rules resolve it) or build.
      - name: Build shared-types
        run: pnpm --filter @pmhybrid/shared-types build

      # `prisma migrate deploy` (below) does not run generate on its own,
      # unlike `migrate dev` — needed before api's build/lint/tests can see
      # @prisma/client's generated types.
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm --filter api --filter web lint

      - name: Build
        run: pnpm --filter api --filter web build

      - name: Unit tests
        run: pnpm --filter api --filter web test

      # migrate deploy (not `migrate dev`): applies the already-committed
      # migration files without diffing the schema or prompting — the correct
      # tool for CI/production, vs. dev's own schema-diff workflow (ADR-003).
      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter api exec prisma db seed

      - name: E2E tests
        run: pnpm test:e2e

      - name: Install Playwright Chromium (Roadmap GAP-25)
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Accessibility tests
        run: pnpm test:a11y
