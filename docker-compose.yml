services:
  postgres:
    image: postgres:17-alpine
    container_name: pmhybrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmhybrid
      POSTGRES_PASSWORD: pmhybrid
      POSTGRES_DB: pmhybrid
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - pmhybrid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pmhybrid -d pmhybrid']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmhybrid_postgres_data:
