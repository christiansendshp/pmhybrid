# PM Hub as containers: the database, the API and the web (Roadmap IMPROVEMENT-02c).
# docker-compose.yml, next to this file, is only the database a laptop develops against.
#
#   cp deploy.env.example .env.prod     # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# The values that must be set are marked below with :?, so a missing one stops the
# start with its name instead of starting a stack that cannot work. See docs/deployment.md.
#
# `name` below is deliberately not "pmhybrid": that's the default Compose project name
# docker-compose.yml (next to this file) resolves to as well, since it has no `name` of
# its own — running both from the same checkout, as a laptop that develops against the
# database while also trying this file would, made Compose read this file's `postgres`
# service as an update to *that* one's container and silently replace it, on this file's
# own fresh volume, losing nothing (the old volume survives an untagged container) but
# losing the running connection (Roadmap BUG-10). A name of its own for each file rules
# that out regardless of which one runs first or what either happens to be called.
name: pmhybrid-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmhybrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (letters and digits, it goes in a URL)}
      POSTGRES_DB: pmhybrid
    volumes:
      - pmhybrid_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pmhybrid -d pmhybrid']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: pmhybrid-api:${PMHYBRID_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://pmhybrid:${POSTGRES_PASSWORD}@postgres:5432/pmhybrid?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the address the web app is opened at}
      # Who the first administrator is, used only while there is none.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      GIT_PROVIDER_TYPE: ${GIT_PROVIDER_TYPE:-local}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Where the projects' docs folders are, inside the container (see volumes). `:`
      # (the container's own, Linux, path.delimiter) separates multiple roots -- the
      # folder picker starts at the first and can browse either.
      PROJECT_DOCS_BROWSE_ROOT: /data/projects:/data/extra-docs
    volumes:
      # The folders of the projects PM Hub manages when GIT_PROVIDER_TYPE is local. The API
      # runs as the container's node user (uid 1000): it must be able to write here.
      - ${PROJECTS_DIR:-./deploy/projects}:/data/projects
      # A second, independent root for a docs folder that already lives elsewhere on this
      # machine (outside this repo) -- e.g. another project's own docs/, so PM Hub can
      # track it in place instead of it being copied or moved under PROJECTS_DIR. Left
      # unset, EXTRA_DOCS_DIR defaults to an empty local folder, same as PROJECTS_DIR.
      - ${EXTRA_DOCS_DIR:-./deploy/extra-docs}:/data/extra-docs
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: pmhybrid-web:${PMHYBRID_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Where the browser reaches the API (not where this container does).
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL to the address the browser reaches the API at}
    ports:
      - '${WEB_PORT:-8080}:8080'

volumes:
  pmhybrid_data:
