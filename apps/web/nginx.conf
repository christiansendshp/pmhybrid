# The web image's server (Roadmap IMPROVEMENT-02c): the built app, with the single-page
# fallback, and a config.js that is never cached (it says where the API is).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Files with a hash in their name never change.
  location ~* \.(?:js|css|woff2?|ico|svg|png|jpe?g)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The health of the container itself, for a probe.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    try_files $uri $uri/ /index.html;
  }
}
