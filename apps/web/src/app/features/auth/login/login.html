<main class="login">
  <section class="login__panel" aria-labelledby="login-heading">
    <p class="login__brand">PM Hub</p>
    <h1 id="login-heading">Log in</h1>

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </mat-form-field>

      @if (errorMessage()) {
        <p role="alert">{{ errorMessage() }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="form.invalid || submitting()">
        Log in
      </button>
    </form>
  </section>
</main>
