<main class="login">
  <section class="login__panel" aria-labelledby="login-heading">
    <p class="login__brand">
      <span class="login__mark" aria-hidden="true"></span>
      PM Hub
    </p>
    <h1 id="login-heading">Iniciar sesión</h1>
    <p class="login__tagline">Coordina personas y agentes IA sobre los documentos del proyecto.</p>

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </mat-form-field>

      @if (errorMessage()) {
        <p class="login__error" role="alert">{{ errorMessage() }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>
  </section>
</main>
