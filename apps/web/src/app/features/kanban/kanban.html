<h2>Kanban</h2>

@if (showCreateForm()) {
  <app-task-form
    [hierarchy]="hierarchy()"
    [tasks]="allTasks()"
    [submitting]="creating()"
    [errorMessage]="createError()"
    (save)="create($event)"
    (cancelled)="showCreateForm.set(false)"
  />
} @else {
  <button mat-flat-button type="button" (click)="openCreateForm()">New task</button>
}

<div>
  <input
    [ngModel]="titleFilter()"
    (ngModelChange)="titleFilter.set($event)"
    placeholder="Filter by title…"
  />
  <mat-select
    placeholder="Filter by assignee…"
    [ngModel]="assigneeFilter()"
    (ngModelChange)="assigneeFilter.set($event)"
  >
    <mat-option [value]="null">All assignees</mat-option>
    @for (member of members(); track member.actorId) {
      <mat-option [value]="member.actorId">{{ member.actor.displayName }}</mat-option>
    }
  </mat-select>
</div>

<div cdkDropListGroup>
  @for (status of statuses; track status) {
    <section>
      <h3>{{ status }}</h3>
      <div
        [id]="'column-' + status"
        cdkDropList
        [cdkDropListData]="tasksByStatus()[status]"
        [cdkDropListConnectedTo]="connectedListsFor(status)"
        (cdkDropListDropped)="onDrop($event, status)"
      >
        @for (task of tasksByStatus()[status]; track task.id) {
          <div cdkDrag [cdkDragData]="task">
            <a [routerLink]="['../tasks', task.id]">{{ task.title }}</a>
          </div>
        }
      </div>
    </section>
  }
</div>
